[package]
name = "opencrvs-desktop"
version = "2.2.0"
description = "Proof of concept: the OpenCRVS client as a desktop app"
license = "MPL-2.0"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Only plain HTTP to 127.0.0.1, so no TLS and no compression.
ureq = { version = "2", default-features = false }
getrandom = "0.2"

[profile.release]
strip = true
lto = true
